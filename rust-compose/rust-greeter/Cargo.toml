[package]
name = "rust-greeter"
version = "0.1.0"
edition = "2021"

[dependencies]
ferris-says = "0.3.2"
wit-bindgen-rt = { version = "0.44.0", features = ["bitflags"] }

[lib]
crate-type = ["cdylib"]

[profile.release]
codegen-units = 1
opt-level = "s"
debug = false
strip = true
lto = true

[package.metadata.component]
package = "scala-wasm:rust-compose"

[package.metadata.component.target]
world = "rust"
path = "wit"

